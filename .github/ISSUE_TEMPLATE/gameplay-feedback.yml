name: 🎮 Gameplay Feedback
description: Submit feedback about gameplay, UX, or UI issues
title: "[Feedback] "
labels: ["feedback"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🎮 玩法反馈

        感谢你的反馈！请填写以下内容帮助我们改进。

  - type: dropdown
    id: feedback-type
    attributes:
      label: 反馈类型
      options:
        - Bug（功能异常）
        - Improvement（体验改进）
        - Feature Request（新功能建议）
        - Confusion（体验困惑，看不懂某处）
        - Praise（好评！）
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 描述你遇到的情况
      placeholder: "尽量具体：什么时候、哪个界面、做了什么操作、期望看到什么、实际看到什么"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望是什么样的？
      placeholder: "尽量描述清楚"
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图或录屏（可选）
      placeholder: "拖放或粘贴截图到这里"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 环境信息（可选）
      placeholder: "浏览器 / 操作系统 / 网络环境"
    validations:
      required: false

  - type: checkboxes
    id: can-reproduce
    attributes:
      label: 可复现性
      options:
        - label: "这个问题我可以稳定复现"
          required: false
        - label: "这是偶发问题"
          required: false
